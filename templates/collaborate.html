<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaborate | Serengeti Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="page-header">
    <h1> Collaborate</h1>
    <div class="header-links">
      <a href="/">Home</a>
    </div>
  </header>

  <div class="page-wrapper" style="max-width:680px;">

    <h2 class="section-title">Available Users</h2>

    <!-- Search -->
    <div class="collab-search">
      <span class="search-icon">🔍</span>
      <input type="text" id="user-search" placeholder="Search users…">
    </div>

    {% if users %}
      {% for user in users %}
      <div class="user-card">
        <div class="user-info">
          <img class="avatar avatar-md"
            src="{{ url_for('static', filename='profile_images/' + user.profile_pic) }}"
            alt="{{ user.username }}">
          <a href="/user/{{ user.username }}" class="username">{{ user.username }}</a>
        </div>

        <div class="user-actions">
          <a href="/user_posts/{{ user.username }}" class="btn btn-ghost btn-sm">Posts</a>
          <span class="join-count" id="joins-{{ user.username }}">{{ user.joins }} joined</span>
          <button class="btn btn-primary btn-sm" id="btn-{{ user.username }}"
            onclick="toggleJoin('{{ user.username }}')">
            {{ 'Unjoin' if user.joined else 'Join' }}
          </button>
        </div>
      </div>
      {% endfor %}
    {% else %}
      <div class="empty-state">No users available for collaboration right now. 🌍</div>
    {% endif %}

  </div>

  <script>
  function toggleJoin(username) {
    fetch(`/toggle_join/${username}`, { method: "POST" })
      .then(r => r.json())
      .then(data => {
        if (data.error) return;
        document.getElementById("joins-" + username).innerText = data.joins + " joined";
        document.getElementById("btn-" + username).innerText =
          data.action === "joined" ? "Unjoin" : "Join";
      });
  }

  document.getElementById("user-search").addEventListener("input", function () {
    const f = this.value.toLowerCase();
    document.querySelectorAll(".user-card").forEach(card => {
      const name = card.querySelector(".username").innerText.toLowerCase();
      card.style.display = name.includes(f) ? "" : "none";
    });
  });
  </script>
</body>
</html>
