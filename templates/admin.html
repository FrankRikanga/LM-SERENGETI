<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Serengeti Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin-page">
  <div class="admin-card">
    <h2>⚙️ Admin Panel</h2>

    <div class="form-group">
      <label class="form-label">Category</label>
      <select id="category" class="form-control">
        <option value="general">General</option>
        <option value="science">Science</option>
        <option value="politics">Politics</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Question</label>
      <input type="text" id="question" class="form-control" placeholder="Enter question" required>
    </div>

    <div class="form-group">
      <label class="form-label">Answer</label>
      <textarea id="answer" class="form-control" placeholder="Enter answer" required></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">English Translation</label>
      <textarea id="translation" class="form-control" placeholder="Enter English translation" required></textarea>
    </div>

    <button class="btn btn-accent" onclick="addQA()">Add Q&amp;A</button>

    <p id="admin-msg"></p>

    <div class="admin-nav">
      <a href="/logout">Logout</a>
      <a href="/">← Home</a>
    </div>
  </div>

  <script>
    async function addQA() {
      const data = {
        category:    document.getElementById("category").value,
        question:    document.getElementById("question").value,
        answer:      document.getElementById("answer").value,
        translation: document.getElementById("translation").value
      };
      const res  = await fetch("/admin/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      document.getElementById("admin-msg").innerText = await res.text();
    }
  </script>
</body>
</html>
