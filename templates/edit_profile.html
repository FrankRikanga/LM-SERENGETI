<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile | Serengeti Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="page-header">
    <h1>✏️ Edit Profile</h1>
    <div class="header-links">
      <a href="/user_profile">← Back</a>
    </div>
  </header>

  <div class="page-wrapper" style="max-width:600px;">
    <div class="card">
      <form method="POST" enctype="multipart/form-data">

        <!-- Avatar preview -->
        <div class="edit-profile-preview">
          <img id="profilePreview"
            src="{{ profile.profile_pic or 'default_avatar.png' }}"
            alt="Profile Preview">
          <div>
            <div style="font-weight:600; margin-bottom:4px;">Profile Photo</div>
            <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
              Change Photo
              <input type="file" name="profile_pic" accept="image/*"
                onchange="previewImage(event)"
                style="display:none;">
            </label>
          </div>
        </div>

        <hr class="divider">

        <div class="form-group">
          <label class="form-label">Name</label>
          <input class="form-control" type="text" name="name" value="{{ profile.name or '' }}" placeholder="Your name">
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email" value="{{ profile.email or '' }}" placeholder="your@email.com">
        </div>

        <div class="form-group">
          <label class="form-label">Age</label>
          <input class="form-control" type="number" name="age" value="{{ profile.age or '' }}" placeholder="Your age">
        </div>

        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="form-control" name="notes" placeholder="Write something about yourself…">{{ profile.notes or '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-full">💾 Save Changes</button>
      </form>
    </div>
  </div>

  <script>
  function previewImage(e) {
    document.getElementById('profilePreview').src = URL.createObjectURL(e.target.files[0]);
  }
  </script>
</body>
</html>
