<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ username }}'s Posts | Serengeti Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="page-header">
    <h1>Posts</h1>
    <div class="header-links">
      <a href="/collaborate">← Back</a>
    </div>
  </header>

  <div class="page-wrapper" style="max-width:680px;">

    <!-- User Header -->
    <div class="user-posts-header">
      <img class="avatar avatar-md"
        src="{{ url_for('static', filename='profile_images/' + profile_pic) }}"
        alt="{{ username }}">

      <div class="user-posts-info">
        <h3>{{ username }}'s Posts</h3>
        <small id="join-count-text">{{ joins }} joined</small>
      </div>

      <div class="header-actions">
        <button id="joinBtn" class="btn btn-accent btn-sm"
          onclick="toggleJoin('{{ username }}')">
          {{ 'Unjoin' if joined else 'Join' }}
        </button>
      </div>
    </div>

    <!-- Posts -->
    {% if posts %}
      {% for post in posts %}
      <div class="post-card">
        <div class="post-body" style="width:100%;">
          <a href="/post/{{ post[0] }}" style="text-decoration:none;">
            <div class="post-text">{{ post[1] }}</div>
          </a>
          <div class="post-time">{{ post[2] }}</div>
          <div class="post-actions">
            <button class="like-btn" data-id="{{ post[0] }}">
              ❤️ <span class="count">{{ post[3] }}</span>
            </button>
            <span style="font-size:0.82rem; color:var(--text-muted);">💬 {{ post[4] }} replies</span>
          </div>
        </div>
      </div>
      {% endfor %}
    {% else %}
      <div class="empty-state">Hakuna cha kuona sasa 😌</div>
    {% endif %}

  </div>

  <script>
  function toggleJoin(username) {
    fetch(`/toggle_join/${username}`, { method: "POST" })
      .then(r => r.json())
      .then(data => {
        if (data.error) return;
        document.getElementById("joinBtn").innerText =
          data.action === "joined" ? "Unjoin" : "Join";
      });
  }

  document.querySelectorAll(".like-btn").forEach(btn => {
    btn.onclick = () => {
      fetch(`/toggle_like/${btn.dataset.id}`, { method: "POST" })
        .then(r => r.json())
        .then(data => {
          if (data.likes !== undefined) {
            btn.querySelector(".count").textContent = data.likes;
            btn.classList.toggle("liked", data.action === "liked");
          }
        });
    };
  });
  </script>
</body>
</html>
