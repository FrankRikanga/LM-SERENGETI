<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ user.name }} | Serengeti Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
/* BASE */
body {
    font-family: "Poppins", sans-serif;
    margin: 0;
    background: linear-gradient(to bottom right, #eaf4ff, #f8fbff);
    color: #333;
}
header {
    background: #007bff;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
header h1 { font-size: 1.5em; margin: 0; }
header a {
    color: white;
    background: rgba(255,255,255,0.2);
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
    margin-top: 6px;
}
header a:hover { background: rgba(255,255,255,0.35); }

/* MAIN */
main {
    max-width: 800px;
    margin: 30px auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    padding: 25px;
}

/* PROFILE */
.profile {
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid #eee;
    padding-bottom: 20px;
    flex-wrap: wrap;
}
.profile img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #007bff;
}
.profile h2 { margin: 0; color: #007bff; }
.profile p { margin: 3px 0; color: #666; }

/* SECTIONS */
.section { margin-top: 25px; }
.section h3 { color: #007bff; margin-bottom: 10px; }
.card {
    background: #f9fbff;
    border-radius: 8px;
    padding: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

/* BUTTONS */
textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    resize: none;
    height: 100px;
    font-family: inherit;
}
.actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
}
.btn {
    background: #007bff;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    flex: 1;
}
.btn.edit {
    background: #28a745;
}
.btn:hover { opacity: 0.9; }
.btn.edit:hover { opacity: 0.85; }

/* RESPONSIVE */
@media (max-width: 480px) {
    .profile {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    .profile div { width: 100%; }
    .actions {
        flex-direction: column;
    }
    .btn { flex: unset; width: 100%; }
}
</style>
</head>
<body>
  <header>
    <h1> {{ user.name or 'User Profile' }}</h1>
    <a href="/">Home</a>
  </header>

  <main>
    <div class="profile">
      <img 
      src="{{ url_for('static', filename='profile_images/' + (user.profile_pic or 'default_avatar.png')) }}"
      alt=".......Profile ...........Picture ..................................."
      style="width:120px; height:120px; border-radius:50%; object-fit:cover;">



      <div>
        <h2>{{ user.name }}</h2>
        <p><strong>Email:</strong> {{ user.email or 'Not specified' }}</p>
        <p><strong>Age:</strong> {{ user.age or 'Not specified' }}</p>
        <p><strong>Role:</strong> {{ user.role or 'user' }}</p>
      </div>
    </div>

    <div class="section">
      <h3>Notes</h3>
      <div class="card">{{ user.notes or 'No notes yet.' }}</div>
    </div>

    <div class="section">
      <h3>Create a Post</h3>
      <form action="/post" method="POST">
  <textarea name="content" placeholder="What's on your mind?"></textarea>
  <div class="actions">
    <button type="submit" class="btn">Post</button>
    <a href="/edit_profile" class="btn edit">Edit Profile</a>
  </div>
</form>

    </div>
  </main>
</body>
</html>
