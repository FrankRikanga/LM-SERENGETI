<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ user.name }} | Serengeti Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="page-header">
    <h1>{{ user.name or 'My Profile' }}</h1>
    <div class="header-links">
      <a href="/">Home</a>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="card">

      <!-- Profile Hero -->
      <div class="profile-hero">
        <img class="avatar avatar-xl"
          src="{{ url_for('static', filename='profile_images/' + (user.profile_pic or 'default_avatar.png')) }}"
          alt="Profile Picture">
        <div class="profile-info">
          <h2>{{ user.name }}</h2>
          <p><strong>Email:</strong> {{ user.email or 'Not specified' }}</p>
          <p><strong>Age:</strong> {{ user.age or 'Not specified' }}</p>
          <span class="badge badge-brand role-badge">{{ user.role or 'user' }}</span>
        </div>
      </div>

      <!-- Notes -->
      <div class="section-title" style="margin-top:22px;"> Notes</div>
      <div class="card" style="background:var(--page-bg); box-shadow:none;">
        {{ user.notes or 'No notes yet.' }}
      </div>

      <!-- Create a Post -->
      <div class="section-title" style="margin-top:22px;">Create a Post</div>
      <form action="/post" method="POST">
        <div class="form-group">
          <textarea class="form-control" name="content" placeholder="What's on your mind?"></textarea>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Post</button>
          <a href="/edit_profile" class="btn btn-success" style="flex:1;"> Edit Profile</a>
        </div>
      </form>

    </div>
  </div>

</body>
</html>
