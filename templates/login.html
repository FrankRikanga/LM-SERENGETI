<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | ChatNow</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #1a73e8, #0b3954);
      margin: 0;
      padding: 0;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px; /* padding for small screens */
    }
    .login-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      padding: 25px 20px;
      text-align: center;
    }
    h2 {
      margin-bottom: 15px;
      font-size: 22px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      background: #f0f4f8;
      color: #333;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #ffcc00;
      color: #1a1a1a;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      font-size: 16px;
      margin-top: 10px;
    }
    button:hover {
      background: #ffd633;
    }
    p {
      color: #ffb3b3;
      font-weight: bold;
      font-size: 14px;
      margin: 8px 0 0 0;
    }
    a {
      color: #ffcc00;
      text-decoration: none;
      display: inline-block;
      margin-top: 8px;
      font-size: 14px;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Responsive adjustments for small screens */
    @media (max-width: 480px) {
      .login-container {
        padding: 20px 15px;
      }
      h2 {
        font-size: 20px;
      }
      input {
        padding: 10px;
      }
      button {
        padding: 10px;
        font-size: 15px;
      }
      a, p {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <form method="POST">
      <h2>Login</h2>
      {% if error %}
      <p>{{ error }}</p>
      {% endif %}
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <a href="{{ url_for('register') }}">Create an account</a><br>
      <a href="{{ url_for('home') }}">Back to home</a>
    </form>
  </div>
</body>
</html>
