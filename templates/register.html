<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Serengeti Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand-logo">AmSerengeti</div>
    <div class="brand-tagline">Join the community today</div>

    <form method="POST">
      <h2>Create Account</h2>

      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}
      {% if success %}
      <div class="auth-success">{{ success }}</div>
      {% endif %}

      <div class="form-group">
        <input class="form-control" type="text" name="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <input class="form-control" type="password" name="password" placeholder="Create a password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Register</button>

      <div class="auth-links">
        <a href="{{ url_for('login') }}">Already have an account? Login</a>
        <a href="{{ url_for('home') }}">← Back to Home</a>
      </div>
    </form>
  </div>
</body>
</html>
