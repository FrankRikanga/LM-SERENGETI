<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | ChatNow</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #1a73e8, #0b3954);
      margin: 0;
      padding: 0;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .register-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 420px;
      padding: 30px;
      text-align: center;
    }
    h2 { margin-bottom: 15px; font-size: 24px; letter-spacing: 1px; text-transform: uppercase; }
    input {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      background: #f0f4f8;
      color: #333;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #ffcc00;
      color: #1a1a1a;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      font-size: 16px;
    }
    button:hover { background: #ffd633; }
    p { color: #ffb3b3; font-weight: bold; }
    a {
      display: inline-block;
      margin-top: 10px;
      color: #ffcc00;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="register-container">
    <form method="POST">
      <h2>Create Account</h2>
      {% if error %}<p>{{ error }}</p>{% endif %}
      {% if success %}<p style="color: #ccffcc;">{{ success }}</p>{% endif %}
      <input type="text" name="username" placeholder="Choose a username" required>
      <input type="password" name="password" placeholder="Create a password" required>
      <button type="submit">Register</button>
      <a href="{{ url_for('login') }}">Already have an account? Login</a><br>
      <a href="{{ url_for('home') }}">Back to Home</a>
    </form>
  </div>
</body>
</html>
