<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community | Serengeti Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="page-header">
    <h1>Community Feed/Jamii</h1>
    <div class="header-links">
      <a href="/user_profile">My Profile</a>
      <a href="/">Home</a>
    </div>
  </header>

  <div class="page-wrapper" style="max-width:720px;">

    {% for post in posts %}
    <div class="post-card">
      <img class="avatar avatar-md"
        src="{{ url_for('static', filename='profile_images/' + (post[4] or 'default_avatar.png')) }}"
        alt="Profile">

      <div class="post-body">
        <div class="post-author"><a href="/user/{{ post[3] }}">{{ post[3] }}</a></div>

        <div class="post-text">
          <a href="/post/{{ post[0] }}">{{ post[1] }}</a>
        </div>

        <div class="post-time">{{ post[2] }}</div>

        <div class="post-actions">
          <button class="like-btn" data-id="{{ post[0] }}">
            ❤️ <span class="count">{{ post[5] }}</span>
          </button>

          {% if session.role == 'admin' or session.user_id|int == post[6]|int %}
          <button class="delete-btn" data-id="{{ post[0] }}">Delete</button>
          {% endif %}
        </div>
      </div>
    </div>
    {% else %}
    <div class="empty-state">No posts yet. Be the first to post! 🌟</div>
    {% endfor %}

  </div>

  <script>
  document.querySelectorAll(".like-btn").forEach(btn => {
    btn.onclick = () => {
      fetch(`/toggle_like/${btn.dataset.id}`, { method: "POST" })
        .then(r => r.json())
        .then(data => {
          if (data.likes !== undefined) {
            btn.querySelector(".count").textContent = data.likes;
            btn.classList.toggle("liked", data.action === "liked");
          }
        });
    };
  });

  document.querySelectorAll(".delete-btn").forEach(btn => {
    btn.onclick = () => {
      if (!confirm("Delete this post?")) return;
      fetch(`/delete_post/${btn.dataset.id}`, { method: "POST" })
        .then(r => r.json())
        .then(data => {
          if (data.success) btn.closest(".post-card").remove();
          else alert(data.error || "Could not delete post.");
        });
    };
  });
  </script>
</body>
</html>
