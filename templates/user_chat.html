<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with {{ target }} | Serengeti</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="uchat-layout">

  <div class="uchat-box">

    <div class="uchat-header">
      <span class="uchat-title">💬 Chat with {{ target }}</span>
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <span class="uchat-notif">
          New <span class="uchat-badge" id="notif-count">0</span>
        </span>
        <a href="{{ url_for('home') }}">← Home</a>
      </div>
    </div>

    <div class="uchat-messages" id="messages"></div>

    <div class="uchat-input">
      <input type="text" id="user_input" placeholder="Type a message…">
      <button class="btn btn-primary send-btn" onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>
  const messagesDiv = document.getElementById("messages");
  const notifBadge  = document.getElementById("notif-count");

  async function loadMessages() {
    const data = await (await fetch(`/get_messages/{{ target }}`)).json();
    messagesDiv.innerHTML = "";
    let unread = 0;
    data.forEach(msg => {
      const div = document.createElement("div");
      div.className = msg.sender === "{{ target }}" ? "msg-bubble friend" : "msg-bubble user";
      div.textContent = msg.message;
      messagesDiv.appendChild(div);
      if (msg.sender === "{{ target }}") unread++;
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    notifBadge.textContent = unread;
  }

  async function sendMessage() {
    const input = document.getElementById("user_input");
    const msg   = input.value.trim();
    if (!msg) return;
    const div = document.createElement("div");
    div.className = "msg-bubble user";
    div.textContent = msg;
    messagesDiv.appendChild(div);
    input.value = "";
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    await fetch("/send_message", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `receiver={{ target }}&message=${encodeURIComponent(msg)}`
    });
  }

  // Poll every 3s
  setInterval(loadMessages, 3000);
  loadMessages();

  document.getElementById("user_input").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
  </script>
</body>
</html>
