<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post | Serengeti Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="page-header">
    <h1>💬 Community Post</h1>
    <div class="header-links">
      <a href="/community">← Back</a>
    </div>
  </header>

  <div class="page-wrapper" style="max-width:720px;">

    <!-- Original Post -->
    <div class="post-detail-card">
      <div class="post-detail-body">

        <div class="post-card" style="box-shadow:none; padding:0; margin:0;">
          <img class="avatar avatar-md"
            src="{{ url_for('static', filename='profile_images/' + post[3]) }}"
            alt="Profile">
          <div class="post-body">
            <div class="post-author">{{ post[2] }}</div>
            <div class="post-text">{{ post[0] }}</div>
            <div class="post-time">{{ post[1] }}</div>
          </div>
        </div>

        <hr class="divider">

        <!-- Replies -->
        <div class="section-title">💬 Replies</div>

        {% for c in comments %}
        <div class="reply-card">
          <img class="avatar avatar-sm"
            src="{{ url_for('static', filename='profile_images/' + (c[3] if c[3] else 'default_avatar.png')) }}"
            alt="Profile">
          <div style="flex:1; min-width:0;">
            <div class="reply-meta">{{ c[2] }}</div>
            <div class="reply-text">{{ c[0] }}</div>
            <div class="reply-time">{{ c[1] }}</div>
          </div>
        </div>
        {% else %}
        <p style="color:var(--text-muted); font-size:0.875rem; margin:10px 0;">No replies yet. Be the first!</p>
        {% endfor %}

        <!-- Reply Form -->
        <form method="POST" action="/comment/{{ post_id }}" class="reply-form">
          <div class="reply-input-row">
            <img class="avatar avatar-sm" style="margin-top:4px;"
              src="{{ url_for('static', filename='profile_images/' + current_user_profile) }}"
              alt="You">
            <textarea class="form-control" name="comment" required
              placeholder="Write a reply…"></textarea>
          </div>
          <div class="reply-submit-row">
            <button type="submit" class="btn btn-primary btn-sm">Reply</button>
            <a href="#" style="font-size:0.82rem; color:var(--brand); font-weight:600;">↑ Top</a>
          </div>
        </form>

      </div>
    </div>

  </div>
</body>
</html>
